{% extends 'base.html' %}

{% block content %}
<div class="container-fluid" style="max-width: 800px;">
    
    <div class="card border-0 shadow-sm mb-4">
        <div class="card-body p-4">
            <div class="d-flex justify-content-between align-items-center mb-3">
                <h2 class="h4 fw-bold mb-0">Répertoire Clients</h2>
                <button class="btn btn-primary btn-sm rounded-pill px-3">
                    <i class="fas fa-user-plus me-1"></i> Nouveau
                </button>
            </div>
            <form method="GET" class="position-relative">
                <input type="text" name="q" class="form-control form-control-lg bg-light border-0 px-5" 
                       placeholder="Nom, téléphone ou adresse..." value="{{ request.GET.q }}">
                <i class="fas fa-search position-absolute top-50 start-0 translate-middle-y ms-3 text-muted"></i>
            </form>
        </div>
    </div>

    <div class="row g-3">
        {% for client in clients %}
        <div class="col-12">
            <div class="card border-0 shadow-sm h-100">
                <div class="card-body d-flex align-items-center">
                    <div class="rounded-circle bg-soft-primary text-primary d-flex align-items-center justify-content-center fw-bold me-3" 
                         style="width: 50px; height: 50px; background-color: #e7f1ff;">
                        {{ client.name|slice:":1"|upper }}
                    </div>
                    
                    <div class="flex-grow-1">
                        <h6 class="fw-bold mb-0">{{ client.name }}</h6>
                        <small class="text-muted"><i class="fas fa-phone-alt me-1"></i> {{ client.phone|default:"Aucun numéro" }}</small>
                    </div>

                    <div class="text-end">
                        <div class="btn-group">
                            <a href="tel:{{ client.phone }}" class="btn btn-outline-success btn-sm border-0">
                                <i class="fas fa-phone"></i>
                            </a>
                            <button class="btn btn-outline-primary btn-sm border-0">
                                <i class="fas fa-edit"></i>
                            </button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
        {% empty %}
        <div class="text-center py-5">
            <img src="https://cdn-icons-png.flaticon.com/512/11329/11329974.png" width="80" class="opacity-25 mb-3">
            <p class="text-muted">Aucun client trouvé.</p>
        </div>
        {% endfor %}
    </div>
</div>

<style>
    /* Effet au survol sur mobile */
    .card:active {
        background-color: #f8f9fa;
        transform: scale(0.98);
    }
</style>
{% endblock %}
