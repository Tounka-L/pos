{% extends "base.html" %}

{% block content %}
<div class="container d-flex align-items-center justify-content-center" style="min-height: 80vh;">
    <div class="text-center">
        <div class="mb-4">
            <i class="fas fa-wifi-slash fa-5x text-danger"></i>
        </div>
        
        <h2 class="fw-bold">Mode Hors-Ligne</h2>
        <p class="text-muted">
            Oups ! Il semble que votre connexion internet soit interrompue.<br>
            <strong>RBA Digital</strong> garde vos données locales en sécurité.
        </p>

        <div class="mt-4">
            <button onclick="window.location.reload()" class="btn btn-primary btn-lg shadow-sm">
                <i class="fas fa-sync-alt me-2"></i> Réessayer la connexion
            </button>
        </div>
        
        <p class="mt-4 small text-secondary">
            Dès que le réseau revient, vos ventes seront synchronisées.
        </p>
    </div>
</div>
{% endblock %}
